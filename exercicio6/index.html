<!--
desenvolva um protótipo de site de
e-commerce usando o Bootstrap:
1. Crie navbar responsiva com contador do carrinho.
2. Renderize produtos em cards: 1 / 2 / 3 colunas conforme a largura.
3. Use botão “Adicionar” e atualize o badge com JavaScript.
4. Mostre um toast ou alert após a ação.
5. Teste em 375 px, 800 px e 1200 px.
-->
<!DOCTYPE html>
<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="utf-8">
    </head>
    <body>
        <!--navbar: classe base; navbar-dark: muda a cor do texto/ícones pra um tom claro; bg-dark: cor escura de fundo -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark"><!--navbar-expand-lg: breakpoint a partir de 992px expande, abaixo disso vira menu hamburguer-->
            <div class="container">
                <a class="navbar-brand h1" href="#">Loja</a><!--navbar-brand: logo/nome: altera font-size, line-height, margin-right-->
                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu"> <!--navbar-toggler: estiliza o botão; data-bs-toggle="collapse": ativa uma ação no js de expandir ou encolher-->
                    <span class="navbar-toggler-icon"></span><!--navbar-toggler-icon:estiliza o ícone-->
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                Carrinho
                                <span>0</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <!--Vai na main o conteúdo específico de cada página-->
        <main class="container my-4"><!-- m: margin; y: eixo y; 4 ~ 1.5rem/24px -->
            <div class="row">
                <section class="col-md-8">
                    <div class="row g-4" id="listaProdutos">
                    </div>
                </section>

                <aside class="col-md-4 bg-info">
                    Carrinho
                </aside>         
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="script.js"></script>
    </body>
</html>
