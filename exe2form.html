<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Teste</title>
</head>

<body>
    <form action="sucesso.html" target="_blank" method="GET">
        <label for="dataNascimento">Data de nascimento: </label>
        <input type="date" id="dataNascimento" name="dataNascimento">
        <output id="idade" name="idade"></output>
        <br><br> <label>Peso (kg):</label>
        <input type="number" id="peso" name="peso">
        <br><br>
        <select id="tpsanguineo" name="tpsanguineo">
            <option>Selecione o tipo sanguíneo</option>
            <option>O</option>
            <option>A</option>
            <option>B</option>
            <option>AB</option>
        </select>
        <select id="rh" name="rh">
            <option>Selecione o fator Rh</option>
            <option>+</option>
            <option>-</option>
        </select>
        <br><br>
        <label for="sexoM">Sexo Masculino</label>
        <input type="radio" id="sexoM" name="sexoM" value="Masculino">
        <label for="sexoF">Sexo Feminino</label>
        <input type="radio" id="sexoF" name="sexoF" value="Feminino">
        <label for="sexoO">Outro</label>
        <input type="radio" id="sexoO" name="sexoO" value="Outro">
        <br><br>
        <label for="doc">Número de documento:</label>
        <input type="text" id="doc" name="doc">
        <br><br>
        <fieldset>
            <legend>Informações Adicionais</legend>
            <br>
            <input type="checkbox" id="atividadeFisica" name="atividadeFisica" value="pratico atividade fisica">
            <label for="atividadeFisica"> Pratico atividade física</label>
            <br><br>
            <input type="checkbox" id="medicacao" name="medicacao" value="uso medicacao">
            <label for="medicacao">Uso medicação contínua</label>
            <br><br>
            <input type="checkbox" id="fumante" name="fumante" value="sou fumante">
            <label for="fumante">Sou fumante</label>
        </fieldset>
        <br><br>
        <button type="submit">Enviar</button>
    </form>
</body>

</html>
